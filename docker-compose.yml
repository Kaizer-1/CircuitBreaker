# The local "umbrella project" (docs/05-coding-standards.md section 2): one file that runs the whole system.
# Profiles:  infra = Redpanda, Cassandra, Postgres + init jobs      app = the 8 services + web
# Use the Makefile (make infra / make up / make down); the app profile's depends_on needs the infra profile active.
name: circuitbreaker

# Settings every Python service gets. Credentials below are local-development placeholders only.
x-python-env: &python-env
  ENVIRONMENT: dev
  LOG_LEVEL: INFO
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

services:
  # --------------------------------------------------------------------------- infrastructure
  redpanda:
    image: redpandadata/redpanda:v26.2.6
    profiles: [infra]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092" # Kafka API for tools on the host
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: 896m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:\\s+true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redpanda-init:
    image: redpandadata/redpanda:v26.2.6
    profiles: [infra]
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    environment:
      REDPANDA_BROKERS: redpanda:9092
    volumes:
      - ./dev/redpanda:/init:ro
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 128m
    restart: "no"

  redpanda-console:
    image: redpandadata/console:v3.13.1
    profiles: [infra]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8088:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/admin/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  cassandra:
    image: cassandra:5.0.9
    profiles: [infra]
    entrypoint: ["/bin/bash", "/opt/cb/entrypoint.sh"]
    command: ["cassandra", "-f"]
    environment:
      CASSANDRA_CLUSTER_NAME: circuitbreaker-dev
      # Laptop tuning: a 512 MB heap instead of the default (up to 1/4 of RAM), a small young generation,
      # and a short ring delay so a single node does not wait 30 s for peers that do not exist.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      JVM_EXTRA_OPTS: "-Dcassandra.ring_delay_ms=1000 -Dcassandra.skip_wait_for_gossip_to_settle=0"
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./dev/cassandra/entrypoint.sh:/opt/cb/entrypoint.sh:ro
    mem_limit: 2048m # measured: 1.3-1.4 GiB at idle with a 512 MB heap; the rest is headroom for write load
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'SELECT release_version FROM system.local' >/dev/null"]
      interval: 15s
      timeout: 20s
      retries: 20
      start_period: 60s

  cassandra-init:
    image: cassandra:5.0.9
    profiles: [infra]
    entrypoint: ["/bin/bash", "/init/init-keyspaces.sh"]
    environment:
      CASSANDRA_HOST: cassandra
    volumes:
      - ./dev/cassandra/init-keyspaces.sh:/init/init-keyspaces.sh:ro
    depends_on:
      cassandra:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  postgres:
    image: postgres:16.15
    profiles: [infra]
    environment:
      POSTGRES_PASSWORD: postgres # admin password, local development only
    ports:
      - "5433:5432" # host port 5433 so a Postgres you installed yourself on 5432 is never confused with this one
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dev/postgres/01-portfolio.sql:/docker-entrypoint-initdb.d/01-portfolio.sql:ro
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --------------------------------------------------------------------------- application services

  api-gateway:
    build: ./services/api-gateway
    image: circuitbreaker/api-gateway:dev
    profiles: [app]
    ports:
      - "8080:8000"
    environment:
      <<: *python-env
      SERVICE_UPSTREAMS: '{"order-service":"http://order-service:8000","matching-engine":"http://matching-engine:8000","market-data-service":"http://market-data-service:8000","portfolio-service":"http://portfolio-service:8000","bot-traders":"http://bot-traders:8000","sre-agent":"http://sre-agent:8000","chaos-service":"http://chaos-service:8000"}'
    mem_limit: 192m
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    image: circuitbreaker/order-service:dev
    profiles: [app]
    ports:
      - "8001:8000"
    environment:
      <<: [*python-env, *kafka-env]
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_KEYSPACE: order_service
      CASSANDRA_USERNAME: order_service_role
      CASSANDRA_PASSWORD: cb_dev_order_service
      PORTFOLIO_URL: http://portfolio-service:8000 # A-06, the synchronous reservation (ADR-0011)
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  matching-engine:
    build: ./services/matching-engine
    image: circuitbreaker/matching-engine:dev
    profiles: [app]
    ports:
      - "8002:8000"
    environment:
      <<: [*python-env, *kafka-env]
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_KEYSPACE: matching_engine
      CASSANDRA_USERNAME: matching_engine_role
      CASSANDRA_PASSWORD: cb_dev_matching_engine
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  market-data-service:
    build: ./services/market-data-service
    image: circuitbreaker/market-data-service:dev
    profiles: [app]
    ports:
      - "8003:8000"
    environment:
      <<: [*python-env, *kafka-env]
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_KEYSPACE: market_data
      CASSANDRA_USERNAME: market_data_role
      CASSANDRA_PASSWORD: cb_dev_market_data
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  portfolio-service:
    build: ./services/portfolio-service
    image: circuitbreaker/portfolio-service:dev
    profiles: [app]
    ports:
      - "8004:8000"
    environment:
      <<: [*python-env, *kafka-env]
      POSTGRES_HOST: postgres
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio_service
      POSTGRES_PASSWORD: cb_dev_portfolio
      ORDER_SERVICE_URL: http://order-service:8000 # A-19, the fail-closed orphan sweeper (ADR-0017)
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    mem_limit: 192m
    restart: unless-stopped

  bot-traders:
    build: ./services/bot-traders
    image: circuitbreaker/bot-traders:dev
    profiles: [app]
    ports:
      - "8005:8000"
    environment:
      <<: [*python-env, *kafka-env]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  sre-agent:
    build: ./services/sre-agent
    image: circuitbreaker/sre-agent:dev
    profiles: [app]
    ports:
      - "8006:8000"
    environment:
      <<: [*python-env, *kafka-env]
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_KEYSPACE: sre_agent
      CASSANDRA_USERNAME: sre_agent_role
      CASSANDRA_PASSWORD: cb_dev_sre_agent
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  chaos-service:
    build: ./services/chaos-service
    image: circuitbreaker/chaos-service:dev
    profiles: [app]
    ports:
      - "8007:8000"
    environment:
      <<: [*python-env, *kafka-env]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  web:
    build: ./web
    image: circuitbreaker/web:dev
    profiles: [app]
    ports:
      - "5173:8080" # nginx-unprivileged listens on 8080 inside the container
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

volumes:
  redpanda-data:
  cassandra-data:
  postgres-data:
