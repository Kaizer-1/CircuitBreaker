[project]
name = "matching-engine"
version = "0.1.0"
description = "CircuitBreaker matching-engine: price-time matching and the market event store (skeleton)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
  "pydantic-settings>=2.16,<3",
  "prometheus-client>=0.26,<1",
  "aiokafka[lz4,snappy,zstd]>=0.15,<1",  # every codec rpk/Console may use
  "cassandra-driver>=3.30,<4",
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.4,<2",
  "httpx2>=2,<3",  # starlette's TestClient
  "pyyaml>=6,<7",
  "types-pyyaml>=6,<7",
  "ruff>=0.17,<1",
  "mypy>=2.4,<3",
  "hypothesis>=6.170,<7",
  "jsonschema[format-nongpl]>=4.26,<5",
  "pytest-cov>=7.1,<8",
  "testcontainers[cassandra]>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs real Cassandra/Redpanda/Postgres (testcontainers)"]
# The full run enforces 100% branch coverage of domain/ (roadmap, Phase 2). For a partial run
# (one file, or `-m integration`) add --no-cov.
addopts = "-m 'not integration' --cov=matching_engine.domain --cov-branch --cov-fail-under=100 --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]  # pytest uses plain assert; simulations use seeded (non-crypto) random

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Optional drivers: imported lazily in runtime/checks.py, and not every service installs every driver.
module = ["aiokafka.*", "cassandra.*", "psycopg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test-only libraries without type information.
module = ["jsonschema.*", "testcontainers.*"]
ignore_missing_imports = true
