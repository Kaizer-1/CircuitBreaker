[project]
name = "portfolio-service"
version = "0.1.0"
description = "CircuitBreaker portfolio-service: accounts, reservations, settlement and the leaderboard (skeleton)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
  "pydantic-settings>=2.16,<3",
  "prometheus-client>=0.26,<1",
  "aiokafka[lz4,snappy,zstd]>=0.15,<1",  # every codec rpk/Console may use
  "psycopg[binary]>=3.3,<4",
  "psycopg-pool>=3.3,<4",
  "httpx>=0.28,<1",
  "websockets>=17.4,<18",  # uvicorn serves the Q-10 WebSocket with it
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.4,<2",
  "httpx2>=2,<3",  # starlette's TestClient
  "pyyaml>=6,<7",
  "types-pyyaml>=6,<7",
  "ruff>=0.17,<1",
  "mypy>=2.4,<3",
  "hypothesis>=6.170,<7",
  "testcontainers[postgres]>=4.15,<5",
  "pytest-cov>=7.1,<8",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs real Cassandra/Redpanda/Postgres (testcontainers)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest uses plain assert

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Optional drivers: imported lazily in runtime/checks.py, and not every service installs every driver.
module = ["aiokafka.*", "cassandra.*", "psycopg.*"]
ignore_missing_imports = true
