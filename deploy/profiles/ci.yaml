# The slim "ci" profile (owner's decision, 2026-11-23): what CI's platform job deploys on a GitHub runner (2 CPUs,
# about 7 GB). It tests the plumbing, Terraform -> Argo CD -> sync -> PostSync smoke test, not performance: the demo
# profile is the full system (deploy/envs/ only). Argo CD adds this file after deploy/envs/staging/*.yaml when
# Terraform's profile is "ci" (infra/envs/local, var.profile). Only CPU requests and replica counts change: the
# scheduler adds up requests, and the full ones (about 3.1 cores with Kubernetes itself) leave pods Pending on 2 CPUs.
# Limits, images and settings stay those of staging.

global:
  smoke:
    wait: 900 # a cold runner pulls every image and starts Cassandra on 2 CPUs
api-gateway:
  replicas: 1
  resources:
    requests: {cpu: 20m, memory: 96Mi}
