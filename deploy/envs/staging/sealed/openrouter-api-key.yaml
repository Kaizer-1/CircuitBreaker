# openrouter-api-key in staging: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as staging/openrouter-api-key. make seal env=staging
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openrouter-api-key
  namespace: staging
spec:
  encryptedData:
    value: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: openrouter-api-key
      namespace: staging
    type: Opaque
