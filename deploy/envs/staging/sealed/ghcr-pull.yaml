# ghcr-pull in staging: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as staging/ghcr-pull. make seal env=staging
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: staging
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: ghcr-pull
      namespace: staging
    type: kubernetes.io/dockerconfigjson
