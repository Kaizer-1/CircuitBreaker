# sre-agent-db in staging: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as staging/sre-agent-db. make seal env=staging
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sre-agent-db
  namespace: staging
spec:
  encryptedData:
    password: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: sre-agent-db
      namespace: staging
    type: Opaque
