# portfolio-service-db in staging: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as staging/portfolio-service-db. make seal env=staging
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: portfolio-service-db
  namespace: staging
spec:
  encryptedData:
    password: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: portfolio-service-db
      namespace: staging
    type: Opaque
