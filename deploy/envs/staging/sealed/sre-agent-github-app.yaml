# sre-agent-github-app in staging: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as staging/sre-agent-github-app. make seal env=staging
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sre-agent-github-app
  namespace: staging
spec:
  encryptedData:
    app-id: 
    installation-id: 
    private-key: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: sre-agent-github-app
      namespace: staging
    type: Opaque
