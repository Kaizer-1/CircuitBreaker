# cassandra-admin in staging: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as staging/cassandra-admin. make seal env=staging
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cassandra-admin
  namespace: staging
spec:
  encryptedData:
    password: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: cassandra-admin
      namespace: staging
    type: Opaque
