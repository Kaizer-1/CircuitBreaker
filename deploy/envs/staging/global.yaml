# Settings for every service in staging (releases are tested here first; chaos rehearsals).
# make k8s-up env=staging passes this file and the per-service files next to it to the umbrella chart.
global:
  environment: staging
  ingressEntryPoint: staging # http://<laptop>:8090/
  image:
    # The read-only GHCR login (deploy/envs/staging/sealed/ghcr-pull.yaml). Unused for images in the local registry.
    pullSecrets: [ghcr-pull]
