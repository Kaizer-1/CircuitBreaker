# bot-secret in prod: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as prod/bot-secret. make seal env=prod
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: bot-secret
  namespace: prod
spec:
  encryptedData:
    value: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: bot-secret
      namespace: prod
    type: Opaque
