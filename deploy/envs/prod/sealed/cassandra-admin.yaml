# cassandra-admin in prod: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as prod/cassandra-admin. make seal env=prod
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cassandra-admin
  namespace: prod
spec:
  encryptedData:
    password: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: cassandra-admin
      namespace: prod
    type: Opaque
