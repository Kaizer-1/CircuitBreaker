# ghcr-pull in prod: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as prod/ghcr-pull. make seal env=prod
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: prod
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: ghcr-pull
      namespace: prod
    type: kubernetes.io/dockerconfigjson
