# sre-agent-github-app in prod: a SealedSecret (ADR-0019), encrypted to the cluster's sealing key.
# Only the controller can decrypt it, and only as prod/sre-agent-github-app. make seal env=prod
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sre-agent-github-app
  namespace: prod
spec:
  encryptedData:
    app-id: 
    installation-id: 
    private-key: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: circuitbreaker
      name: sre-agent-github-app
      namespace: prod
    type: Opaque
