# Settings for every service in prod (the live demo audience).
# make k8s-up env=prod passes this file and the per-service files next to it to the umbrella chart.
global:
  environment: prod
  ingressEntryPoint: web # http://<laptop>/ (port 80)
  image:
    # The read-only GHCR login (deploy/envs/prod/sealed/ghcr-pull.yaml). Unused for images in the local registry.
    pullSecrets: [ghcr-pull]
