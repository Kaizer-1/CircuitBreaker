# Shared OpenAPI components used by every CircuitBreaker spec.
# Not a standalone API: specs reference these with $ref: './shared/common.yaml#/components/...'
# Field names and enums must match docs/03-architecture/03-event-catalog.md.
components:
  schemas:
    Problem:
      type: object
      description: Error body in RFC 9457 Problem Details format, served as application/problem+json.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Link to the error's documentation.
          examples: ['https://circuitbreaker.local/errors/insufficient-funds']
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Stable machine-readable code (see api/README.md error catalog).
          examples: [INSUFFICIENT_FUNDS]
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: The request path that failed.
        correlation_id:
          type: string
          description: Same value as the X-Correlation-Id header; use it to search logs.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    Ticker:
      type: string
      enum: [CHAIWALA, JUGAAD, DABBA, MONSOON, FILMY]
      description: One of the five fictional instruments.
    Side:
      type: string
      enum: [BUY, SELL]
    OrderType:
      type: string
      enum: [LIMIT, MARKET]
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601, UTC.
    PricePaise:
      type: integer
      minimum: 5
      multipleOf: 5
      description: Price in paise (1 rupee = 100 paise). Must be a multiple of the 5-paise tick size.
    Quantity:
      type: integer
      minimum: 1
      maximum: 10000
      description: Number of shares (lot size is 1).
    ServiceName:
      type: string
      enum:
        - api-gateway
        - order-service
        - matching-engine
        - market-data-service
        - portfolio-service
        - bot-traders
        - sre-agent
        - chaos-service
    AgentAction:
      type: string
      enum: [rollback_deployment, scale_deployment, restart_deployment, do_nothing]
      description: The SRE agent's fixed tool allowlist.
    AccountKind:
      type: string
      enum: [HUMAN, BOT, LOAD]
      description: HUMAN = trader who joined via QR; BOT = one of the 20 bots; LOAD = chaos load-generator account.
    Role:
      type: string
      enum: [trader, bot, admin]

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Request ID propagated through every service and event. Generated by api-gateway if absent.
      schema:
        type: string
        maxLength: 64
      example: req-5f1c2a
    TraderIdHeader:
      name: X-Trader-Id
      in: header
      required: true
      description: Authenticated trader ID. Set ONLY by api-gateway after verifying the JWT; never trusted from clients.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 3d2a1b0c-9e8f-4a7b-8c6d-5e4f3a2b1c0d
    RoleHeader:
      name: X-Role
      in: header
      required: true
      description: Authenticated role. Set ONLY by api-gateway after verifying the JWT.
      schema:
        $ref: '#/components/schemas/Role'
      example: admin
    TickerPath:
      name: ticker
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ticker'
      example: CHAIWALA
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's next_cursor.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://circuitbreaker.local/errors/bad-request
            title: Bad request
            status: 400
            code: BAD_REQUEST
            detail: Request body is not valid JSON.
            correlation_id: req-5f1c2a
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://circuitbreaker.local/errors/unauthenticated
            title: Not signed in
            status: 401
            code: UNAUTHENTICATED
            detail: The access token is missing or has expired. Join again to get a new one.
            correlation_id: req-5f1c2a
    Forbidden:
      description: Authenticated, but the role is not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://circuitbreaker.local/errors/forbidden
            title: Not allowed
            status: 403
            code: FORBIDDEN
            detail: This action requires the admin role.
            correlation_id: req-5f1c2a
    NotFound:
      description: The resource does not exist (or does not belong to the caller).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://circuitbreaker.local/errors/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
            detail: No such resource.
            correlation_id: req-5f1c2a
    ValidationFailed:
      description: The request is well-formed but breaks a business or validation rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://circuitbreaker.local/errors/validation-failed
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            detail: One or more fields are invalid.
            correlation_id: req-5f1c2a
            errors:
              - field: limit_price_paise
                message: must be a multiple of 5 (tick size is 0.05 rupees)
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://circuitbreaker.local/errors/rate-limited
            title: Slow down
            status: 429
            code: RATE_LIMITED
            detail: Limit is 20 requests per second per trader.
            correlation_id: req-5f1c2a
    ServiceUnavailable:
      description: A dependency is unavailable (circuit breaker open) or the service is overloaded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://circuitbreaker.local/errors/dependency-unavailable
            title: Temporarily unavailable
            status: 503
            code: DEPENDENCY_UNAVAILABLE
            detail: portfolio-service is not responding; please retry shortly.
            correlation_id: req-5f1c2a
