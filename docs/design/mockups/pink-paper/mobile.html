<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Paper · Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,800;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; min-height: 844px; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; padding: 0 16px 24px; }
  .mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: var(--double); padding: 12px 0 6px; }
  .mast b { font-family: var(--font-head); font-size: 24px; font-weight: 800; }
  .mast b em { font-weight: 400; color: var(--accent); }
  .mast span { font-size: 14px; font-weight: 600; }
  .worth { padding: 10px 0 8px; border-bottom: var(--hairline); display: flex; justify-content: space-between; align-items: end; }
  .worth .lbl { font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3); }
  .worth .v { font-family: var(--font-num); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .worth .pnl { font-family: var(--font-num); font-size: 18px; font-weight: 600; text-align: right; }
  .worth .pnl small { display: block; font-family: var(--font-ui); font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .tickers { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: var(--hairline); }
  .tickers button { all: unset; cursor: pointer; padding: 8px 2px 7px; text-align: center; border-right: 1px solid var(--rule-soft); min-height: 48px; }
  .tickers button:last-child { border-right: 0; }
  .tickers button .t { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; display: block; }
  .tickers button .c { font-family: var(--font-num); font-size: 12px; display: block; margin-top: 2px; }
  .tickers button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
  .tickers button[aria-pressed='true'] .c { color: var(--paper); }
  .quote { display: flex; justify-content: space-between; align-items: end; padding: 10px 0 4px; }
  .quote h1 { font-family: var(--font-head); font-size: 26px; font-weight: 600; line-height: 1; }
  .quote h1 small { display: block; font-size: 15px; font-style: italic; font-weight: 400; color: var(--ink-2); margin-top: 3px; }
  .quote .p { font-family: var(--font-num); font-size: 40px; font-weight: 600; letter-spacing: -1px; line-height: 1; }
  .quote .c { font-family: var(--font-num); font-size: 15px; font-weight: 600; text-align: right; margin-top: 2px; }
  svg.mini { display: block; width: 100%; height: 120px; border-bottom: var(--hairline); }
  .ticket { border: var(--double); margin-top: 12px; padding: 12px; background: var(--paper-tint); }
  .ticket h2 { font-family: var(--font-head); font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: var(--hairline); margin-bottom: 10px; }
  .seg button { all: unset; cursor: pointer; text-align: center; min-height: 48px; line-height: 48px; font-weight: 700; letter-spacing: 1.5px; font-size: 15px; }
  .seg button + button { border-left: var(--hairline); }
  .seg .buy[aria-pressed='true'] { background: var(--up); color: var(--paper); }
  .seg .sell[aria-pressed='true'] { background: var(--down); color: var(--paper); }
  .seg .on[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-2); display: block; margin-bottom: 4px; }
  .step { display: grid; grid-template-columns: 48px 1fr 48px; border: var(--hairline); background: var(--paper); }
  .step button { all: unset; cursor: pointer; text-align: center; font-size: 24px; line-height: 48px; }
  .step output, .step input { font-family: var(--font-num); font-size: 20px; font-weight: 600; text-align: center; line-height: 48px; border: 0; background: none; width: 100%; color: var(--ink); }
  .est { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); margin: 10px 0; }
  .est b { font-family: var(--font-num); color: var(--ink); }
  .place { all: unset; cursor: pointer; display: block; width: 100%; text-align: center; min-height: 56px; line-height: 56px; background: var(--up); color: var(--paper); font-weight: 700; font-size: 18px; letter-spacing: 1px; }
  h3 { font-family: var(--font-head); font-size: 20px; font-weight: 600; border-bottom: var(--hairline); padding: 14px 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
  h3 small { font-family: var(--font-ui); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .order { display: grid; grid-template-columns: 1fr auto; align-items: center; border-bottom: 1px solid var(--rule-soft); padding: 8px 0; gap: 8px; }
  .order .what { font-size: 15px; } .order .what b { font-weight: 700; }
  .order .what .num { text-align: left; display: inline; }
  .order .st { font-size: 12px; color: var(--ink-3); letter-spacing: 1px; text-transform: uppercase; }
  .cancel { all: unset; cursor: pointer; min-height: 44px; line-height: 44px; padding: 0 14px; border: var(--hairline); font-weight: 700; font-size: 14px; letter-spacing: 1px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 7px 4px; border-bottom: 1px solid var(--rule-soft); font-size: 15px; }
  th { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-3); text-align: right; font-weight: 600; }
  th:first-child, td:first-child { text-align: left; font-weight: 700; }
</style>
</head>
<body>
  <header class="mast"><b>CircuitBreaker <em>Markets</em></b><span id="nick"></span></header>
  <section class="worth">
    <div><div class="lbl">Net worth</div><div class="v num" id="worth" style="text-align:left"></div></div>
    <div class="pnl up" id="pnl"></div>
  </section>
  <nav class="tickers" id="tickers"></nav>
  <section class="quote">
    <h1>CHAIWALA<small>Chaiwala Beverages</small></h1>
    <div><div class="p num" id="price"></div><div class="c up" id="chg"></div></div>
  </section>
  <svg class="mini" id="mini"></svg>
  <section class="ticket">
    <h2>Place an order</h2>
    <div class="seg"><button class="buy" aria-pressed="true">▲ BUY</button><button class="sell" aria-pressed="false">▼ SELL</button></div>
    <div class="seg"><button class="on" aria-pressed="true">LIMIT</button><button class="on" aria-pressed="false">MARKET</button></div>
    <div class="row">
      <div><label>Quantity</label><div class="step"><button aria-label="Less">−</button><output>10</output><button aria-label="More">+</button></div></div>
      <div><label>Limit price ₹</label><div class="step"><button aria-label="Lower">−</button><output>247.80</output><button aria-label="Higher">+</button></div></div>
    </div>
    <div class="est"><span>Reserves</span><b id="cost"></b></div>
    <div class="est" style="margin-top:-6px"><span>Available cash</span><b id="avail"></b></div>
    <button class="place">BUY 10 CHAIWALA AT ₹247.80</button>
  </section>
  <h3>Open orders <small>Tap to cancel</small></h3>
  <div id="orders"></div>
  <h3>Holdings <small>At last price</small></h3>
  <table><thead><tr><th>Stock</th><th>Qty</th><th>Avg ₹</th><th>P&amp;L ₹</th></tr></thead><tbody id="hold"></tbody></table>
<script src="../shared/market.js"></script>
<script>
  const M = MOCK, P = M.portfolio, h = M.hero
  const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim()
  const arrow = (x) => (x >= 0 ? '▲' : '▼')
  document.getElementById('nick').textContent = P.nickname
  document.getElementById('worth').textContent = '₹' + M.rupees(P.netWorth)
  document.getElementById('pnl').innerHTML = `${arrow(P.pnl)} ${M.rupees(P.pnl, { sign: true })}<small>${M.pct(P.pnlPct)} since you joined</small>`
  document.getElementById('tickers').innerHTML = M.tickers.map((t, i) => `<button aria-pressed="${i === 0}"><span class="t">${t.ticker}</span><span class="c ${t.change >= 0 ? 'up' : 'down'}">${arrow(t.change)}${Math.abs(t.changePct).toFixed(1)}%</span></button>`).join('')
  document.getElementById('price').textContent = '₹' + M.rupees(h.last)
  document.getElementById('chg').textContent = `▲ ${M.rupees(h.change, { sign: true })}  ${M.pct(h.changePct)}`
  M.drawCandles(document.getElementById('mini'), M.miniCandles, { up: v('--up'), down: v('--down'), bg: v('--paper'), hollowUp: true, grid: v('--rule-soft') })
  document.getElementById('cost').textContent = '₹' + M.rupees(10 * 24780)
  document.getElementById('avail').textContent = '₹' + M.rupees(P.cash - P.reserved)
  document.getElementById('orders').innerHTML = M.openOrders.map((o) => `<div class="order"><div><div class="what"><b class="${o.side === 'BUY' ? 'up' : 'down'}">${o.side === 'BUY' ? '▲' : '▼'} ${o.side}</b> ${o.qty} ${o.ticker} at <span class="num">₹${M.rupees(o.price)}</span></div><div class="st">${o.status === 'OPEN' ? 'Open' : `Part filled · ${o.filled} of ${o.qty}`}</div></div><button class="cancel">CANCEL</button></div>`).join('')
  document.getElementById('hold').innerHTML = P.holdings.map((x) => `<tr><td>${x.ticker}</td><td class="num">${x.qty}</td><td class="num">${M.rupees(x.avg)}</td><td class="num ${x.pnl >= 0 ? 'up' : 'down'}">${arrow(x.pnl)} ${M.rupees(x.pnl, { sign: true })}</td></tr>`).join('')
</script>
</body>
</html>
