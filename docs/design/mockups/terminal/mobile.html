<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal · Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; background: var(--bg); color: var(--text); font-family: var(--font-data); font-size: 15px; display: grid; grid-template-rows: 48px 1fr 60px; overflow: hidden; }
  .cmd { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--grid); }
  .badge { background: var(--amber); color: var(--amber-ink); font-weight: 800; padding: 4px 8px; font-size: 14px; }
  .prompt { flex: 1; color: var(--amber); font-size: 17px; } .prompt span { color: var(--text); }
  .prompt i { display: inline-block; width: 9px; height: 18px; background: var(--amber); vertical-align: -3px; }
  .who { color: var(--text-2); font-size: 13px; }
  .body { overflow: hidden; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .pnl { background: var(--panel); border: 1px solid var(--grid); }
  .pnl > header { display: flex; justify-content: space-between; background: var(--panel-head); padding: 3px 8px; font-family: var(--font-label); font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: var(--text-2); text-transform: uppercase; border-bottom: 1px solid var(--grid); }
  .pnl > header b { color: var(--amber); font-family: var(--font-data); }
  .acct { display: grid; grid-template-columns: 1fr auto; padding: 6px 8px; align-items: end; }
  .acct .nw { font-size: 24px; font-weight: 700; text-align: left; }
  .acct .pl { font-size: 16px; font-weight: 700; text-align: right; } .acct .pl small { display: block; font-size: 12px; color: var(--text-2); font-weight: 500; }
  .acct .k { font-family: var(--font-label); font-size: 11px; color: var(--text-3); letter-spacing: 1.2px; }
  .quote { display: flex; justify-content: space-between; align-items: end; padding: 6px 8px 0; }
  .quote .px { font-size: 44px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .quote .ch { font-size: 16px; font-weight: 700; text-align: right; } .quote .ch small { display: block; color: var(--text-2); font-weight: 500; font-size: 13px; }
  .tkrs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--grid); }
  .tkrs button { all: unset; cursor: pointer; text-align: center; padding: 5px 0; min-height: 44px; border-right: 1px solid var(--grid); font-size: 11px; }
  .tkrs button:last-child { border-right: 0; }
  .tkrs button b { display: block; color: var(--amber); font-size: 11px; }
  .tkrs button[aria-pressed='true'] { background: var(--amber); } .tkrs button[aria-pressed='true'] b, .tkrs button[aria-pressed='true'] span { color: var(--amber-ink); }
  svg.mini { display: block; width: 100%; height: 92px; }
  .ticket { padding: 8px; display: grid; gap: 6px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button { all: unset; cursor: pointer; text-align: center; min-height: 48px; line-height: 48px; font-weight: 800; font-size: 17px; border: 1px solid var(--grid); color: var(--text-2); }
  .seg .buy[aria-pressed='true'] { background: var(--up); color: #04130a; border-color: var(--up); }
  .seg .sell[aria-pressed='true'] { background: var(--down); color: #1a0505; border-color: var(--down); }
  .seg .on[aria-pressed='true'] { border-color: var(--amber); color: var(--amber); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .f { border: 1px solid var(--grid); display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
  .f button { all: unset; cursor: pointer; text-align: center; font-size: 22px; line-height: 46px; color: var(--amber); }
  .f output { text-align: center; font-size: 18px; font-weight: 700; }
  .lbl { font-family: var(--font-label); font-size: 11px; color: var(--text-3); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 2px; }
  .est { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); } .est b { color: var(--text); }
  .go { all: unset; cursor: pointer; text-align: center; min-height: 52px; line-height: 52px; background: var(--up); color: #04130a; font-weight: 800; font-size: 17px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 5px 8px; border-bottom: 1px solid #1c1f22; font-size: 14px; }
  th { font-family: var(--font-label); font-size: 11px; color: var(--text-3); letter-spacing: 1.2px; text-align: right; font-weight: 600; text-transform: uppercase; }
  th:first-child, td:first-child { text-align: left; }
  td.x { text-align: right; } td.x button { all: unset; cursor: pointer; color: var(--amber); border: 1px solid var(--amber); padding: 0 10px; min-height: 36px; line-height: 36px; font-weight: 700; font-size: 13px; }
  nav.keys { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--grid); background: #070808; }
  nav.keys span { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-label); font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--text-2); border-right: 1px solid var(--grid); }
  nav.keys span b { font-family: var(--font-data); color: var(--amber); font-size: 14px; }
  nav.keys span.on { background: var(--amber); color: var(--amber-ink); } nav.keys span.on b { color: var(--amber-ink); }
</style>
</head>
<body>
  <div class="cmd"><span class="badge">CB</span><div class="prompt">&gt; <span>CHAIWALA</span> GP<i></i></div><span class="who" id="nick"></span></div>
  <div class="body">
    <section class="pnl"><header><span>Account</span><span>₹1,00,000 START</span></header>
      <div class="acct"><div><div class="k">NET WORTH</div><div class="nw num" id="nw"></div></div><div class="pl up" id="pl"></div></div>
    </section>
    <section class="pnl"><header><span><b>CHAIWALA</b> EQUITY</span><span>5S</span></header>
      <div class="quote"><div class="px num" id="px"></div><div class="ch up" id="ch"></div></div>
      <svg class="mini" id="mini"></svg>
      <div class="tkrs" id="tkrs"></div>
    </section>
    <section class="pnl"><header><span>Order ticket</span><span>AVAIL <b id="avail"></b></span></header>
      <div class="ticket">
        <div class="seg"><button class="buy" aria-pressed="true">▲ BUY</button><button class="sell" aria-pressed="false">▼ SELL</button></div>
        <div class="seg"><button class="on" aria-pressed="true">LIMIT</button><button class="on" aria-pressed="false">MARKET</button></div>
        <div class="fields"><div><div class="lbl">Qty</div><div class="f"><button aria-label="Less">−</button><output class="num" style="text-align:center">10</output><button aria-label="More">+</button></div></div><div><div class="lbl">Limit ₹</div><div class="f"><button aria-label="Lower">−</button><output class="num" style="text-align:center">247.80</output><button aria-label="Higher">+</button></div></div></div>
        <div class="est"><span>RESERVES</span><b class="num" id="cost"></b></div>
        <button class="go">&lt;GO&gt; BUY 10 @ 247.80</button>
      </div>
    </section>
    <section class="pnl"><header><span>Open orders</span><span>2</span></header>
      <table><tbody id="orders"></tbody></table>
    </section>
  </div>
  <nav class="keys"><span class="on"><b>F1</b>MARKET</span><span><b>F2</b>DEPTH</span><span><b>F3</b>TRADES</span><span><b>F4</b>PORTFOLIO</span></nav>
<script src="../shared/market.js"></script>
<script>
  const M = MOCK, P = M.portfolio, h = M.hero
  const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim()
  const arrow = (x) => (x >= 0 ? '▲' : '▼'), cls = (x) => (x >= 0 ? 'up' : 'down')
  document.getElementById('nick').textContent = P.nickname
  document.getElementById('nw').textContent = M.rupees(P.netWorth)
  document.getElementById('pl').innerHTML = `${arrow(P.pnl)} ${M.rupees(P.pnl, { sign: true })}<small>${M.pct(P.pnlPct)}</small>`
  document.getElementById('px').textContent = M.rupees(h.last)
  document.getElementById('ch').innerHTML = `▲ ${M.rupees(h.change, { sign: true })}<small>${M.pct(h.changePct)}</small>`
  M.drawCandles(document.getElementById('mini'), M.miniCandles, { up: v('--up'), down: v('--down'), bg: v('--panel'), grid: v('--grid'), gridDash: '2 4' })
  document.getElementById('tkrs').innerHTML = M.tickers.map((t, i) => `<button aria-pressed="${i === 0}"><b>${t.ticker}</b><span class="${i === 0 ? '' : cls(t.change)}">${arrow(t.change)}${Math.abs(t.changePct).toFixed(1)}%</span></button>`).join('')
  document.getElementById('avail').textContent = M.rupees(P.cash - P.reserved)
  document.getElementById('cost').textContent = M.rupees(10 * 24780)
  document.getElementById('orders').innerHTML = M.openOrders.map((o) => `<tr><td class="${o.side === 'BUY' ? 'up' : 'down'}">${arrow(o.side === 'BUY' ? 1 : -1)} ${o.side[0]} ${o.qty} ${o.ticker}</td><td class="num">${M.rupees(o.price)}</td><td class="num" style="color:var(--text-2)">${o.status === 'OPEN' ? 'OPEN' : 'PART ' + o.filled + '/' + o.qty}</td><td class="x"><button>CXL</button></td></tr>`).join('')
</script>
</body>
</html>
