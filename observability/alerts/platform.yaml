# Alert rules about pods and the event bus, for any application service (chaos scenarios section 5).
# Same conventions as services.yaml: 10 s evaluation, labels service / severity / remediable.
groups:
  - name: circuitbreaker-platform
    interval: 10s
    rules:
      # An app service's container restarted more than 3 times in 5 minutes, or is still waiting in CrashLoopBackOff
      # after more than 3 restarts. Expected fix: rollback (a bad revision) or restart; the agent decides from the
      # deploy history. The second half keeps it firing while Kubernetes' back-off grows (10 s, 20 s, ... up to
      # 5 minutes between restarts): the restart count alone fell under 4 in 5 minutes and the alert cleared while the
      # pod still crashed (found on staging, 2026-11-27). Data stores and init jobs are left out: the agent never acts
      # on Cassandra, Postgres or Redpanda.
      - alert: PodCrashLooping
        expr: |
          max by (namespace, service) (
            label_replace(
              increase(kube_pod_container_status_restarts_total{namespace=~"prod|staging",container!~"cassandra|postgres|redpanda|init"}[5m]),
              "service", "$1", "container", "(.*)"
            )
          ) > 3
          or
          max by (namespace, service) (
            label_replace(
              (kube_pod_container_status_restarts_total{namespace=~"prod|staging",container!~"cassandra|postgres|redpanda|init"} > 3)
              and on (namespace, pod, container)
              (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1),
              "service", "$1", "container", "(.*)"
            )
          )
        for: 0s
        labels: {severity: critical, remediable: "true"}
        annotations:
          summary: "{{ $labels.service }} keeps crashing: {{ $value | humanize }} restarts"
          description: A container keeps crashing and being restarted by Kubernetes.

      # A consumer is more than 1,000 messages behind its topic. Information only: lag is a symptom (a slow or
      # stopped consumer), so the agent escalates rather than acts. Two sources: the consumer's own gauge, and the
      # broker's view of its group (<service>.<topic>), which still works when the consumer has stopped.
      - alert: ConsumerLagHigh
        expr: |
          max by (namespace, service, topic) (
            consumer_lag_messages
            or
            label_replace(
              label_replace(redpanda_kafka_consumer_group_lag_max, "service", "$1", "redpanda_group", "([^.]+)[.].*"),
              "topic", "$1", "redpanda_group", "[^.]+[.](.*)"
            )
          ) > 1000
        for: 30s
        labels: {severity: warning, remediable: "false"}
        annotations:
          summary: "{{ $labels.service }} is {{ $value | humanize }} messages behind on {{ $labels.topic }}"
          description: A consumer group is falling behind; its read model or reactions are stale.

      # A message went to a dead-letter topic (<topic>.dlq) after failing 5 times. Information only: someone must
      # look at the message.
      - alert: DeadLetterMessages
        expr: |
          sum by (namespace, service, topic) (increase(events_dead_lettered_total[5m])) > 0
        for: 0s
        labels: {severity: warning, remediable: "false"}
        annotations:
          summary: "{{ $labels.service }} sent messages from {{ $labels.topic }} to {{ $labels.topic }}.dlq"
          description: An event failed processing 5 times and was parked on the dead-letter topic.
