# The local Kubernetes cluster (docs/03-architecture/07-deployment-and-environments.md section 3).
# Created by `make k8s-up` (scripts/k8s.py) in Phase 5; Phase 6's Terraform `kind-cluster` module takes over and
# reuses exactly these settings.
#
# One node (owner's decision, 2026-11-13): the control plane also runs the workloads. Every extra kind node costs
# about 280 MiB (kubelet, containerd, networking, a log-collector pod) and another copy of every image, and on one
# laptop it adds no real resilience: all nodes are containers in the same Docker VM.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: circuitbreaker
nodes:
  - role: control-plane
    # Pinned by digest: the default image of kind v0.33.0 (Kubernetes v1.37.0).
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      # Traefik (the ingress controller) runs here with host ports.
      ingress-ready: "true"
    # The ingress is reachable from the laptop's ports. 0.0.0.0 = phones on the hotspot can reach prod and staging;
    # Grafana and Prometheus stay on the laptop (127.0.0.1).
    extraPortMappings:
      - containerPort: 80 # prod: web + the public API, http://<laptop LAN IP>/
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 8090 # staging: the same on its own port
        hostPort: 8090
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 3000 # Grafana
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 9090 # Prometheus
        hostPort: 9090
        listenAddress: "127.0.0.1"
        protocol: TCP
# Images come from the local registry `localhost:5001` (a registry container on kind's Docker network). kind v0.27+
# node images already read /etc/containerd/certs.d; scripts/k8s.py writes the hosts.toml that points
# localhost:5001 at the registry container.
