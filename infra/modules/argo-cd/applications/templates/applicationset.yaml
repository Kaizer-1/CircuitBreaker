{{- if .Values.environments }}
# One Application per component per environment (ADR-0014), e.g. order-service-prod. Argo CD's own templating
# ({{`{{.env}}`}}) is escaped from Helm's.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: circuitbreaker
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                {{- range .Values.environments }}
                - env: {{ . }}
                {{- end }}
          - list:
              elements:
                {{- range .Values.components }}
                - component: {{ . }}
                {{- end }}
  template:
    metadata:
      name: {{`'{{.component}}-{{.env}}'`}}
      labels:
        circuitbreaker.io/env: {{`'{{.env}}'`}}
        circuitbreaker.io/component: {{`'{{.component}}'`}}
    spec:
      project: circuitbreaker
      source:
        repoURL: {{ .Values.repoURL | quote }}
        targetRevision: {{ .Values.targetRevision | quote }}
        path: charts/circuitbreaker
        helm:
          # The same release name as make k8s-up, so every object keeps its name.
          releaseName: circuitbreaker
          valueFiles:
            - {{`'../../deploy/envs/{{.env}}/global.yaml'`}}
            - {{`'../../deploy/envs/{{.env}}/{{.component}}.yaml'`}}
          # The ingress has no values file of its own.
          ignoreMissingValueFiles: true
          parameters:
            - name: global.only
              value: {{`'{{.component}}'`}}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{`'{{.env}}'`}}
      syncPolicy:
        # Git changes deploy by themselves; live changes are only reported (OutOfSync), never undone: self-heal
        # off, so Argo CD never fights a chaos experiment or the SRE agent (ADR-0014).
        automated:
          prune: true
          selfHeal: false
        syncOptions:
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff: {duration: 10s, factor: 2, maxDuration: 3m}
      # The fields the SRE agent's scale_deployment and restart_deployment change. Git does not own them: they are
      # not even compared, and a sync keeps the live values (RespectIgnoreDifferences).
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
            - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
{{- end }}
