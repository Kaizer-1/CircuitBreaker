{{- if .Values.environments }}
# Each environment's SealedSecrets (ADR-0019), from deploy/envs/<env>/sealed/: secrets-staging, secrets-prod. The
# controller in kube-system turns each into a Secret of the same name in that namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: circuitbreaker-secrets
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          {{- range .Values.environments }}
          - env: {{ . }}
          {{- end }}
  template:
    metadata:
      name: {{`'secrets-{{.env}}'`}}
      labels:
        circuitbreaker.io/env: {{`'{{.env}}'`}}
        circuitbreaker.io/component: secrets
    spec:
      project: circuitbreaker
      source:
        repoURL: {{ .Values.repoURL | quote }}
        targetRevision: {{ .Values.targetRevision | quote }}
        path: {{`'deploy/envs/{{.env}}/sealed'`}}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{`'{{.env}}'`}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: false
{{- end }}
