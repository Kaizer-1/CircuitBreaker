# The Sealed Secrets controller (ADR-0019), installed by Terraform's sealed-secrets module (chart sealed-secrets
# 2.22.0 = controller 0.41.2). It holds the private key; only it can turn a SealedSecret from Git into a Secret.

# kubeseal's defaults (controller `sealed-secrets-controller` in kube-system), so no flags are needed.
fullnameOverride: sealed-secrets-controller

image:
  registry: docker.io
  repository: bitnami/sealed-secrets-controller
  # Pinned by version AND digest (the image index): Bitnami keeps only the newest release under this name, so a tag
  # alone could later point elsewhere or vanish. make k8s-prepull pulls exactly this.
  tag: 0.41.2@sha256:e63ec6ec2b12a471bf781081bd370a93ca7b7b3999e5b9243341379aeb801d0b

# No automatic new key every 30 days: each new key would need a new backup, and a forgotten one would leave secrets
# sealed with a key that exists nowhere else. Keys are rotated on purpose (deployment doc, "Rotating the sealing
# key").
keyrenewperiod: "0"

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {cpu: 200m, memory: 128Mi}
