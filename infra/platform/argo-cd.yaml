# Argo CD, the GitOps deployment server (ADR-0014), installed by Terraform's argo-cd module (chart argo-cd 10.18.2 =
# Argo CD v3.6.2). Trimmed for one laptop: no Dex (single sign-on), no notifications, one replica of everything.
# Reached with `make argocd` (a port-forward; it prints the admin password).

# Pinned by tag AND digest (the multi-arch image index): coding standards section 1, "Images".
# The chart has no digest field: the digest rides in the tag (its version label strips it).
global:
  image:
    tag: v3.6.2@sha256:bbcc3b6e79c5963439bdc5170f6e20a52365b41878133fac5ce8d6810d2641dc

dex:
  enabled: false
notifications:
  enabled: false

configs:
  cm:
    # How often Argo CD asks GitHub for new commits. A laptop cannot receive GitHub's webhooks, so it polls; 30 s
    # instead of the default 120 s (+ up to 60 s jitter) makes a push reach staging fast enough to show live
    # (ADR-0014 amendment, 2026-11-23). `make sync` still refreshes at once.
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 0s
    # Ownership by annotation (the v3 default, written down): the charts' own app.kubernetes.io/instance labels are
    # left alone, so selectors never change when Argo CD takes over.
    application.resourceTrackingMethod: annotation
    exec.enabled: false
    admin.enabled: true
    statusbadge.enabled: false
    # The SRE agent's read-only accounts (ADR-0016), one per environment: an API token only, no web login. make
    # platform makes each token (scripts/k8s.py argo-agent-token) and stores it in its environment's namespace.
    accounts.sre-agent-staging: apiKey
    accounts.sre-agent-prod: apiKey
  rbac:
    # Nobody gets a role by default. Each agent may read its OWN environment's Applications and nothing else: no
    # sync, no repositories, no settings, not the other environment. Its pre-check reads one with a forced refresh.
    policy.default: ""
    policy.csv: |
      p, role:sre-agent-staging, applications, get, circuitbreaker/*-staging, allow
      p, role:sre-agent-prod, applications, get, circuitbreaker/*-prod, allow
      g, sre-agent-staging, role:sre-agent-staging
      g, sre-agent-prod, role:sre-agent-prod
  params:
    # Plain HTTP behind the port-forward (no certificate to accept in the browser).
    server.insecure: true
    # Memory: each sync runs kubectl, which is memory-hungry, and the defaults allow 20 at once (Argo CD's
    # high-availability guide). Measured 2026-11-24: a commit that changed every service's pod template started 18
    # syncs together and the controller went from ~180 MiB to OOM-killed at 768 MiB, again on every restart (it
    # resumes them all). 2 kubectl runs and 4 sync operations at a time fit one laptop; syncs queue instead.
    controller.kubectl.parallelism.limit: "2"
    controller.operation.processors: "4"
    controller.status.processors: "10"

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    # 1 GiB, not 768 MiB (owner's decision, 2026-11-24): with the limits above it was still OOM-killed at 750 MiB on
    # 2026-11-24 17:16 UTC, while the first prod release (9 Applications at once, each with a PostSync smoke Job)
    # synced. A limit is a ceiling, not memory in use: it idles at about 330 MiB.
    limits: {cpu: "1", memory: 1Gi}
server:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
redis:
  image:
    tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
