# Runs on every push to main and every pull request. Images are built once, scanned (Trivy) and pushed to GHCR;
# on main, once every job has passed, CI commits the new image tags to deploy/envs/staging/ and Argo CD deploys
# them (ADR-0014; deployment doc section 4). A change to documentation only (docs/, *.md) skips the image builds,
# the integration tests and the end-to-end run, which it cannot affect (the `changes` job).
name: CI

on:
  push:
    branches: [main]
    # CI's own tag bumps (and promotions) change only deploy/envs/: nothing to test or build again.
    paths-ignore: ["deploy/envs/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pull request's newer push replaces its older run. Runs on main queue instead: a cancelled run would leave
  # its images untagged (the next run would still pick them up, but later).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.10.7"
  REDOCLY_VERSION: "1.34.3"
  GITLEAKS_VERSION: "8.30.1"
  HELM_VERSION: "4.3.0"
  TERRAFORM_VERSION: "1.17.2"
  # Trivy is pinned and its download checked against the release's SHA-256 (v0.69.4 was a malicious release,
  # March 2026: a floating version would have run it).
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256_AMD64: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  TRIVY_SHA256_ARM64: "ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3"

jobs:
  changes:
    name: documentation only? (then no images, integration or end-to-end)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base commit must be here to compare with
      - name: Classify the change (tools/ci_changes.py; when in doubt, code)
        id: classify
        env:
          # A pull request: its base and head; a push to main: the commit before and this one.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci_changes.py "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  python:
    name: ${{ matrix.service }} (lint, types, tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - matching-engine
          - market-data-service
          - portfolio-service
          - bot-traders
          - sre-agent
          - chaos-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run --frozen ruff check .
      - name: ruff (format check)
        run: uv run --frozen ruff format --check .
      - name: mypy
        run: uv run --frozen mypy
      - name: pytest (unit, smoke and contract tests against api/)
        run: uv run --frozen pytest

  integration:
    name: ${{ matrix.service }} (integration tests, real stores in Docker)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - matching-engine
          - portfolio-service
          - order-service
          - market-data-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: pytest -m integration (testcontainers)
        run: uv run --frozen pytest -m integration --no-cov

  e2e:
    name: end to end in Compose (demo trade, kill -9 the engine, orphan rule)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The failure step below keeps the containers' logs from this moment on, so they cover
      # the whole test window (a fixed --tail=300 lost the bots check's window on 2026-11-23).
      - name: Note the start time
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build and start every container, wait until all are healthy
        run: make up
      - name: make demo-trade
        run: make demo-trade
      - name: make test-e2e
        run: make test-e2e
      # The phone over a non-secure origin (http://cb.test, like a phone on the LAN), with the
      # runner's Google Chrome: a MARKET buy reaches Holdings, the F-key tabs, both skins.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web dependencies (Playwright)
        working-directory: web
        run: npm ci
      - name: make test-phone (the bots trade, so the MARKET buy has a seller)
        run: |
          make bots seed=42
          make test-phone
      - name: Container logs since the job started (on failure)
        if: failure()
        run: |
          mkdir -p build/container-logs
          for c in $(docker compose --profile infra --profile app config --services); do
            docker compose --profile infra --profile app logs --no-color --since "$JOB_STARTED_AT" "$c" \
              > "build/container-logs/$c.log" 2>&1 || true
          done
          wc -l build/container-logs/*.log
          # The 5xx answers, with route and correlation ID, so the cause is one search away.
          grep -h '"status": 5[0-9][0-9]' build/container-logs/*.log | tail -n 50 || true
      - name: Upload the container logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-container-logs
          path: build/container-logs/
          retention-days: 7

  contracts:
    name: API specs, event contracts, template drift, retired names, Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: redocly lint
        run: npx --yes @redocly/cli@${{ env.REDOCLY_VERSION }} lint
      - name: event schemas equal the event catalog; catalog examples are valid
        run: uv run --quiet --locked tools/check_event_contracts.py
      - name: services still share identical runtime plumbing
        run: python3 tools/check_template_drift.py
      - name: retired instrument names appear only in dated history notes
        run: python3 tools/check_retired_names.py
      - name: CI's documentation-only rule (tools/ci_changes.py)
        run: python3 tools/ci_changes.py --self-test
      - name: Sealed secrets are sealed (the other half of the gitleaks allowlist)
        run: python3 tools/check_sealed_secrets.py
      - name: docker-compose.yml is valid
        run: docker compose --profile infra --profile app config -q

  kubernetes:
    name: Kubernetes charts and alert rules (helm lint, render, kubeconform, promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        run: |
          curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: make k8s-lint
        run: make k8s-lint

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff infra
      # validate needs the providers (from the committed lock file) but no cluster and no state.
      - name: terraform validate
        run: |
          terraform -chdir=infra/envs/local init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/envs/local validate

  web:
    name: web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: image ${{ matrix.image }} ${{ matrix.arch }} (build once, Trivy, GHCR)
    # Each architecture on its own runner, natively: amd64, and arm64 for the demo laptop (Apple Silicon). No
    # emulation, so an arm64 build takes as long as an amd64 one.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to this repository's GHCR packages (GITHUB_TOKEN)
    strategy:
      fail-fast: false
      matrix:
        image:
          - api-gateway
          - order-service
          - matching-engine
          - market-data-service
          - portfolio-service
          - bot-traders
          - sre-agent
          - chaos-service
          - web
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            trivy: 64bit
          - arch: arm64
            runner: ubuntu-24.04-arm
            trivy: ARM64
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      # Push from main and from this repository's own pull requests (their images are tested on staging before a
      # merge); never from a fork.
      PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit itself, not GitHub's merge preview: the tag names a commit that exists.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the plan compares this folder with the commit staging runs
      - name: Plan (changed since the tag staging runs?)
        id: plan
        run: python3 scripts/gitops_images.py plan --service "$IMAGE" | tee -a "$GITHUB_OUTPUT"
      # A pull request always builds and scans every image (a Dockerfile change or a new CVE shows before merging);
      # main builds only what changed: an unchanged image keeps its tag and is not built again.
      - name: Build
        if: github.event_name == 'pull_request' || steps.plan.outputs.build == 'true'
        run: |
          if [ "$IMAGE" = "web" ]; then ctx=web; else ctx="services/$IMAGE"; fi
          ref="${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.tag }}-$ARCH"
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --tag "$ref" "$ctx"
          echo "REF=$ref" >> "$GITHUB_ENV"
      - name: Install Trivy (pinned, checksum verified)
        if: env.REF != ''
        run: |
          if [ "$ARCH" = arm64 ]; then sum="$TRIVY_SHA256_ARM64"; else sum="$TRIVY_SHA256_AMD64"; fi
          curl -sSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${{ matrix.trivy }}.tar.gz"
          echo "$sum  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/trivy && trivy --version
      - name: Trivy (report HIGH and CRITICAL that have a fix)
        if: env.REF != ''
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$REF"
      # The gate (deployment doc section 4): a CRITICAL vulnerability with a fixed version available fails the
      # build; one without a fix is reported above and does not (nothing to upgrade to).
      - name: Trivy (fail on a CRITICAL that has a fix)
        if: env.REF != ''
        run: trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --skip-db-update --no-progress "$REF"
      - name: Push to GHCR (this architecture's tag)
        if: env.REF != '' && env.PUSH == 'true' && steps.plan.outputs.build == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$REF"

  manifests:
    name: image ${{ matrix.image }} (one tag, both architectures)
    needs: [changes, images]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - api-gateway
          - order-service
          - matching-engine
          - market-data-service
          - portfolio-service
          - bot-traders
          - sre-agent
          - chaos-service
          - web
    env:
      IMAGE: ${{ matrix.image }}
      PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Plan (the same answer as the build jobs, same commit and rule)
        id: plan
        run: python3 scripts/gitops_images.py plan --service "$IMAGE" | tee -a "$GITHUB_OUTPUT"
      # The tag Argo CD deploys is an index of the two architecture images: each node pulls its own.
      - name: Join the two architectures under the commit's tag
        if: env.PUSH == 'true' && steps.plan.outputs.build == 'true'
        run: |
          ref="${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.tag }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "$ref" "$ref-amd64" "$ref-arm64"
          docker buildx imagetools inspect "$ref"
          mkdir -p build/images
          printf '{"service": "%s", "tag": "%s", "commit": "%s"}\n' \
            "$IMAGE" "${{ steps.plan.outputs.tag }}" "$(git rev-parse HEAD)" > "build/images/$IMAGE.json"
      - name: Record the pushed image for the tag bump
        if: env.PUSH == 'true' && steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image }}
          path: build/images/${{ matrix.image }}.json
          retention-days: 7

  deploy-staging:
    name: staging tag bumps (GitOps, one commit per service)
    # Only on main, only after every job passed: what reaches staging was tested and scanned. A documentation-only
    # push skips it too (the jobs it needs were skipped: there is no new image to deploy).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, integration, e2e, contracts, kubernetes, terraform, web, images, manifests, gitleaks]
    runs-on: ubuntu-latest
    # The environment holds the deploy key (the one key on the ruleset's bypass list) and releases it only to
    # workflow runs on main: a pull request's run, or a workflow on another branch, cannot read it.
    environment: gitops
    concurrency:
      group: gitops-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: build/images
      - name: Commit each new tag to deploy/envs/staging/ and push to main
        run: |
          git config user.name "circuitbreaker-ci"
          git config user.email "circuitbreaker-ci@users.noreply.github.com"
          python3 scripts/gitops_images.py bump --env staging --from build/images --push

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose
