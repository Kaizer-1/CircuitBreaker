# Runs on every push and pull request. Written in Phase 1; it first runs once the repository is pushed to GitHub.
# Nothing is pushed anywhere yet: Docker images are only built (publishing to GHCR arrives in Phase 6).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.7"
  REDOCLY_VERSION: "1.34.3"
  GITLEAKS_VERSION: "8.30.1"
  HELM_VERSION: "4.3.0"

jobs:
  python:
    name: ${{ matrix.service }} (lint, types, tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - order-service
          - matching-engine
          - market-data-service
          - portfolio-service
          - bot-traders
          - sre-agent
          - chaos-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run --frozen ruff check .
      - name: ruff (format check)
        run: uv run --frozen ruff format --check .
      - name: mypy
        run: uv run --frozen mypy
      - name: pytest (unit, smoke and contract tests against api/)
        run: uv run --frozen pytest

  integration:
    name: ${{ matrix.service }} (integration tests, real stores in Docker)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - matching-engine
          - portfolio-service
          - order-service
          - market-data-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: pytest -m integration (testcontainers)
        run: uv run --frozen pytest -m integration --no-cov

  e2e:
    name: end to end in Compose (demo trade, kill -9 the engine, orphan rule)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and start every container, wait until all are healthy
        run: make up
      - name: make demo-trade
        run: make demo-trade
      - name: make test-e2e
        run: make test-e2e
      # The phone over a non-secure origin (http://cb.test, like a phone on the LAN), with the
      # runner's Google Chrome: a MARKET buy reaches Holdings, the F-key tabs, both skins.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web dependencies (Playwright)
        working-directory: web
        run: npm ci
      - name: make test-phone (the bots trade, so the MARKET buy has a seller)
        run: |
          make bots seed=42
          make test-phone
      - name: Container logs (on failure)
        if: failure()
        run: docker compose --profile infra --profile app logs --tail=300

  contracts:
    name: API specs, event contracts, template drift, retired names, Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: redocly lint
        run: npx --yes @redocly/cli@${{ env.REDOCLY_VERSION }} lint
      - name: event schemas equal the event catalog; catalog examples are valid
        run: uv run --quiet --locked tools/check_event_contracts.py
      - name: services still share identical runtime plumbing
        run: python3 tools/check_template_drift.py
      - name: retired instrument names appear only in dated history notes
        run: python3 tools/check_retired_names.py
      - name: docker-compose.yml is valid
        run: docker compose --profile infra --profile app config -q

  kubernetes:
    name: Kubernetes charts and alert rules (helm lint, render, kubeconform, promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        run: |
          curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: make k8s-lint
        run: make k8s-lint

  web:
    name: web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - api-gateway
          - order-service
          - matching-engine
          - market-data-service
          - portfolio-service
          - bot-traders
          - sre-agent
          - chaos-service
          - web
    steps:
      - uses: actions/checkout@v7
      - name: Build (not pushed)
        run: |
          if [ "${{ matrix.image }}" = "web" ]; then ctx=web; else ctx=services/${{ matrix.image }}; fi
          docker build --tag circuitbreaker/${{ matrix.image }}:ci "$ctx"

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose
