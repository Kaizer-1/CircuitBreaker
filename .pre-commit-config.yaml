# Install once with `make setup` (runs `pre-commit install`). Run on everything: `pre-commit run --all-files`.
# mypy and the tests are too slow for a commit hook; they run in `make lint` / `make test` and in CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-private
        name: block private/ and CLAUDE.md
        entry: scripts/hooks/block-private.sh
        language: script
        always_run: true
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (secret scan of staged changes)
        entry: gitleaks git --staged --redact --no-banner --verbose
        language: system
        always_run: true
        pass_filenames: false

      - id: redocly-lint
        name: redocly lint api/
        entry: npx --yes @redocly/cli@1.34.3 lint
        language: system
        files: ^(api/|redocly\.yaml$)
        pass_filenames: false

      - id: prettier-web
        name: prettier (web)
        entry: scripts/hooks/web-prettier.sh
        language: script
        files: ^web/.*\.(ts|tsx|js|json|css|html)$
        exclude: ^web/(package-lock\.json|dist/)
