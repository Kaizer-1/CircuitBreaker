# Serves the built app and forwards /v1 to the API gateway (so the browser sees one origin: no CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; re-resolve the gateway every few seconds so a restarted gateway is found again.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # PUBLIC_BASE_URL for the join QR code, written at container start by docker/config.sh.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # WebSocket channels (api/README.md): upgrade the connection, and keep it open far longer than
    # the 15 s heartbeat (the services ping every 15 s and close after 45 s without a pong).
    location /v1/ws/ {
        set $gateway http://api-gateway:8000;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        access_log off; # the URL carries ?access_token=, which must never be logged
    }

    location /v1/ {
        set $gateway http://api-gateway:8000;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}
