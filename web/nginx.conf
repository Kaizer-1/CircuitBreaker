# Serves the built app and forwards /v1 to the API gateway (so the browser sees one origin: no CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; re-resolve the gateway every few seconds so a restarted gateway is found again.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v1/ {
        set $gateway http://api-gateway:8000;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}
