image: cassandra:5.0.9@sha256:5e996210152ab03e7e4af435ea853a6657954f1d6360ef1283f56cdbd8ad5020 # the Compose image (Docker official image, Apache License 2.0)
storage: 4Gi
# App names allowed to connect (CQL 9042).
allowFrom: []
# The four keyspaces that have an owner and a login (dev/cassandra/init-keyspaces.sh), each with its owner's Secret.
roles:
  ORDER_SERVICE: order-service-db
  MATCHING_ENGINE: matching-engine-db
  MARKET_DATA: market-data-service-db
  SRE_AGENT: sre-agent-db
resources:
  # 512 MB heap + capped native memory (dev/cassandra/entrypoint.sh): 944-991 MiB process memory measured under the
  # bots plus 60 orders/s, about 1.35 GiB if every cap filled; the rest of the limit is page cache the kernel reclaims.
  requests: {cpu: 250m, memory: 1536Mi}
  limits: {cpu: 2000m, memory: 2Gi}
