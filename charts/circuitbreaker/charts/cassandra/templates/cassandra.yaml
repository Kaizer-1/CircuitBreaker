{{- $only := .Values.global.only | default "" -}}
{{- if or (eq $only "") (eq $only "cassandra") }}
# One Cassandra node (the event store, ADR-0004), tuned for a laptop like docker-compose.yml.
{{- $entrypoint := .Files.Get "files/entrypoint.sh" }}
{{- $init := .Files.Get "files/init-keyspaces.sh" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-scripts
  labels: {app.kubernetes.io/name: cassandra, app.kubernetes.io/part-of: circuitbreaker}
data:
  # Linked from dev/cassandra/: the same files Compose mounts.
  entrypoint.sh: {{ $entrypoint | quote }}
  init-keyspaces.sh: {{ $init | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  labels: {app.kubernetes.io/name: cassandra, app.kubernetes.io/part-of: circuitbreaker}
spec:
  selector: {app.kubernetes.io/name: cassandra}
  ports:
    - {name: cql, port: 9042, targetPort: cql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  labels: {app.kubernetes.io/name: cassandra, app.kubernetes.io/part-of: circuitbreaker}
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cassandra}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cassandra, app.kubernetes.io/part-of: circuitbreaker}
      annotations:
        checksum/entrypoint: {{ $entrypoint | sha256sum }}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60 # time to flush memtables
      containers:
        - name: cassandra
          image: {{ .Values.image }}
          # Turns on password authentication, then runs the image's own entrypoint (dev/cassandra/entrypoint.sh).
          command: ["/bin/bash", "/opt/cb/entrypoint.sh"]
          args: ["cassandra", "-f"]
          env:
            - {name: CASSANDRA_CLUSTER_NAME, value: circuitbreaker-{{ .Values.global.environment }}}
            # Laptop tuning (as in Compose): a 512 MB heap and no wait for absent peers. GC threads, native memory
            # caps, off-heap memtables and the commit log cap: dev/cassandra/entrypoint.sh (memory budget in
            # docs/03-architecture/07-deployment-and-environments.md).
            - {name: MAX_HEAP_SIZE, value: 512M}
            - {name: JVM_EXTRA_OPTS, value: "-Dcassandra.ring_delay_ms=1000 -Dcassandra.skip_wait_for_gossip_to_settle=0"}
          ports:
            - {name: cql, containerPort: 9042}
          volumeMounts:
            - {name: data, mountPath: /var/lib/cassandra}
            - {name: scripts, mountPath: /opt/cb}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # First start takes 30-60 s on a laptop: allow 5 minutes before liveness counts.
          startupProbe:
            tcpSocket: {port: cql}
            periodSeconds: 5
            failureThreshold: 60
          # Ready when Cassandra answers CQL: an OPTIONS request (allowed before logging in) must get SUPPORTED back
          # (protocol v4 reply header 84 00 0000 06). No password, so the pod holds none: the superuser's lives only
          # in the init job, and changing it never makes Cassandra unready.
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/9042 && printf '\x04\x00\x00\x00\x05\x00\x00\x00\x00' >&3
                  && [ "$(head -c 5 <&3 | od -An -tx1 | tr -d ' \n')" = 8400000006 ]
            periodSeconds: 15
            timeoutSeconds: 20
          livenessProbe:
            tcpSocket: {port: cql}
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: scripts
          configMap: {name: cassandra-scripts}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.storage }}}
---
# Keyspaces and login roles, by the script Compose runs. The name carries a hash of the script, so a changed script
# runs again on the next install; the script is idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-init-{{ include "cassandra.initPod" . | sha256sum | trunc 8 }}
  labels: {app.kubernetes.io/name: cassandra-init, app.kubernetes.io/part-of: circuitbreaker}
spec:
  backoffLimit: 10
{{- include "cassandra.initPod" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cassandra
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: cassandra}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.allowFrom }}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: {{ . }}}
        {{- end }}
      ports:
        - port: cql
{{- end }}
