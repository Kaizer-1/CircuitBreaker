{{- if and (include "service.enabled" .) ((.Values.global).smoke).mode }}
{{- $name := include "service.name" . }}
# The PostSync smoke test (deployment doc section 4): after Argo CD has synced this service and it is healthy, check
# the environment end to end through the public API (scripts/smoke.py). Staging: two load-test accounts trade a share;
# prod: a load-test account places a LIMIT buy far below the market and cancels it. A failure fails the sync, which
# Argo CD shows on the Application. Off unless global.smoke.mode is set (deploy/envs/<env>/global.yaml); make k8s-up,
# which has no Argo CD, leaves it off.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-{{ $name }}
  labels:
    app.kubernetes.io/name: smoke-test
    app.kubernetes.io/part-of: circuitbreaker
    circuitbreaker.io/after-sync-of: {{ $name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    # The last run's Job (and its log) stays until the next sync of this service replaces it.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add .Values.global.smoke.wait 480 }} # readiness, then up to 5 attempts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-test
        app.kubernetes.io/part-of: circuitbreaker
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: {{ .Values.global.smoke.image }}
          imagePullPolicy: IfNotPresent
          # The script travels in the Job itself: no image to build, nothing else to keep in step.
          command:
            - python3
            - -c
            - {{ .Files.Get "files/smoke.py" | quote }}
            - --mode
            - {{ .Values.global.smoke.mode | quote }}
            - --account
            - {{ index .Values.global.smoke.accounts $name | quote }}
            - --wait
            - {{ .Values.global.smoke.wait | quote }}
          env:
            - name: GATEWAY
              value: http://api-gateway:8000
            - name: BOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.bot }}
                  key: value
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
