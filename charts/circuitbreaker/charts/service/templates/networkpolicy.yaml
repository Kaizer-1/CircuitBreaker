{{- if include "service.enabled" . }}
# Who may call this service. Everything else is refused by the namespace's default-deny policy (umbrella chart).
# Downstream services trust X-Trader-Id / X-Role only because nothing but the gateway can reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- with .Values.networkPolicy.allowFrom }}
    - from:
        {{- range . }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - port: http
    {{- end }}
    {{- if .Values.networkPolicy.allowIngressController }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingressNamespace }}
      ports:
        - port: http
    {{- end }}
    # Prometheus scrapes /metrics from the observability namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.observabilityNamespace }}
      ports:
        - port: http
{{- end }}
