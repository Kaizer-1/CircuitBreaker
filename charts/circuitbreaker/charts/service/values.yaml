# Defaults for ONE service. The umbrella chart sets these per service under the service's name
# (charts/circuitbreaker/values.yaml); deploy/envs/<env>/<service>.yaml overrides them per environment.

enabled: true

image:
  # <registry>/<repository>:<tag>. The registry and tag default to global.image.*; deploy/envs/<env>/<service>.yaml
  # sets both together (CI writes them there, ADR-0014), so a service moves registry in the same commit as its tag.
  registry: ""
  repository: ""
  tag: ""

replicas: 1
# RollingUpdate (no downtime: maxUnavailable 0, maxSurge 1) or Recreate. Recreate is for the single-writer
# services (matching-engine, bot-traders, sre-agent): two copies side by side, even for seconds, would both write.
strategy: RollingUpdate

port: 8000

# Seconds a stopping pod keeps serving while the endpoints are updated (see the preStop hook).
preStopSleepSeconds: 5

# Plain settings, rendered into the service's ConfigMap and loaded as environment variables.
env: {}
# Secret settings: NAME -> {secret, key}. The Secrets are created outside the chart: SealedSecrets in Git that the
# controller decrypts (ADR-0019), or the local placeholders while developing with make k8s-up.
secretEnv: {}
# Settings an operator changes on the night, not releases: names read from the ConfigMap `operator-settings` when it
# has them (make k8s-set-url writes PUBLIC_BASE_URL, make k8s-bots BOTS_ENABLED and friends). Git and Argo CD never
# own that ConfigMap, so a sync does not reset tonight's hotspot address or turn the bots off.
operatorEnv: []
# Mount the ServiceAccount's token so the service can call the Kubernetes API. Only for services Terraform's
# environment module gives a Role (least privilege): chaos-service (the order-service Deployment, by name) and the
# SRE agent. Every other pod has no token at all.
kubernetesApi: false
# Extra pod annotations; a change rolls the pods. make k8s-check c=gitops-push writes one to measure a commit's way
# to the cluster.
podAnnotations: {}

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: 1000m
    memory: 256Mi

probes:
  # Liveness: restart a truly stuck process. /healthz never checks dependencies, so a database outage cannot cause
  # a restart loop.
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  # Readiness: only receive traffic while dependencies work (/readyz checks the service's own store and topics).
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 3
  # Startup: liveness waits until the process has answered once (up to periodSeconds x failureThreshold).
  startup:
    path: /healthz
    periodSeconds: 2
    failureThreshold: 30

networkPolicy:
  # App names (label app.kubernetes.io/name) allowed to call this service on its port.
  allowFrom: []
  # Let the ingress controller in (web and the public API only).
  allowIngressController: false

metrics:
  # A ServiceMonitor for Prometheus (rendered only when the cluster has the CRD).
  enabled: true
  path: /metrics
  interval: 10s
