{{- if eq (.Values.global.only | default "") "" }}
# Default deny: no pod in this namespace accepts a connection unless a policy lets it in. Each service's own policy
# (charts/service) and each data store's list its callers. Phase 6 moves this to Terraform's environment module,
# because per-service Argo CD Applications render the chart with global.only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels: {app.kubernetes.io/part-of: circuitbreaker}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- end }}
